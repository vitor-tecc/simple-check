# XcodeGen spec: CI runs `xcodegen generate` to create Checklist.xcodeproj
name: Checklist
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
targets:
  Checklist:
    type: application
    platform: iOS
    sources: [Checklist, Shared]
    scheme: {}
    dependencies:
      - target: ChecklistWidget
    entitlements:
      path: Checklist/Checklist.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.checklist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.checklist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Checklist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  # Home Screen and Lock Screen widget showing pinned tasks.
  ChecklistWidget:
    type: app-extension
    platform: iOS
    sources: [ChecklistWidget, Shared]
    entitlements:
      path: ChecklistWidget/ChecklistWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.checklist]
    info:
      path: ChecklistWidget/Info.plist
      properties:
        CFBundleDisplayName: Checklist
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.checklist.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
